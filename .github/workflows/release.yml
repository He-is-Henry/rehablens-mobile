name: Build and Release APK

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate release version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(node -p "require('./app.json').expo.version")

          echo "Git Tag Version: $TAG_VERSION"
          echo "App Version (app.json): $APP_VERSION"

          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "❌ Version mismatch! Git tag is 'v$TAG_VERSION' but app.json is '$APP_VERSION'."
            exit 1
          fi

          echo "✅ Version check passed! Proceeding to build."

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm ci

      - name: Build and Download APK directly
        run: |
          BUILD_OUTPUT=$(eas build --platform android --profile preview --non-interactive --json)
          APK_URL=$(echo "$BUILD_OUTPUT" | jq -r '.[0].artifacts.buildUrl')
          curl -L "$APK_URL" -o rehablens.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: rehablens.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
